name: Build a JAR in spring boot using springboot
on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4


      - name: Set up JDK 21
        uses: actions/setup-java@v4


        with:
          java-version: '21'
          distribution: 'temurin'

      - name: credential
        run: |
          echo "${{ secrets.FCM_CREDENTIAL }}" | base64 --decode > "src/main/resources/${{ secrets.NOTINAME }}"

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven- 

      - name: Build without running tests
        run: mvn clean install -DskipTests 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/springboot-app:latest
            ${{ secrets.DOCKER_USERNAME }}/springboot-app:${{ github.sha }}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4


        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deployment:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DIGI_SSH }}
          script: |
            IMAGE=${{ secrets.DOCKER_USERNAME }}/springboot-app:latest

            echo "Pull latest image"
            docker pull $IMAGE

            echo "Stop & remove old container if exists"
            docker stop splitly-backend || true
            docker rm splitly-backend || true

            echo "Run new container"
            docker run -d \
              --name splitly-backend \
              --network my-bridge-net \
              -p 8080:8080 \
              --restart unless-stopped \
              \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_PORT="${{ secrets.DB_PORT }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e CLOUDINARY_URL="${{ secrets.CLOUDINARY_URL }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              \
              -e EMAIL="${{ secrets.EMAIL }}" \
              -e EMAIL_PASSWORD="${{ secrets.EMAIL_PASSWORD }}" \
              \
              $IMAGE

            docker ps
