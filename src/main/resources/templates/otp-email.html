<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 40px auto; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header { text-align: center; padding-bottom: 20px; border-bottom: 1px solid #eeeeee; }
        .header h1 { margin: 0; color: #333333; }
        .content { padding: 20px 0; color: #555555; text-align: center; }
        .content p { font-size: 16px; line-height: 1.5; }
        .otp-code { font-size: 32px; font-weight: bold; color: #007bff; letter-spacing: 4px; margin: 20px 0; padding: 10px; background-color: #f0f8ff; border-radius: 4px; display: inline-block; }
        .footer { text-align: center; padding-top: 20px; border-top: 1px solid #eeeeee; font-size: 12px; color: #999999; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <!-- Use a variable for the application name -->
        <h1 th:text="${appName}">Splitly</h1>
    </div>
    <div class="content">
        <p>Hello,</p>
        <p>Thank you for registering. Please use the following One-Time Password (OTP) to complete your registration process.</p>
        <div class="otp-code" th:text="${otpCode}">123456</div>
        <p th:text="'This code is valid for ' + ${expiryMinutes} + ' minutes.'">This code is valid for 10 minutes.</p>
        <p>If you did not request this, please ignore this email.</p>
    </div>
    <div class="footer">
        <p>&copy; 2025 <span th:text="${appName}">Splitly</span>. All rights reserved.</p>
    </div>
</div>
</body>
</html>
